# CI-only dbt profile. Used by the GitHub Actions workflows via --profiles-dir ci.
# Local development continues to use ~/.dbt/profiles.yml and is unaffected.
#
# Two CI targets, one per warehouse, each writing to a SEPARATE _ci schema so CI
# never touches the main analytics data:
#   ci           - BigQuery, runs on every PR (.github/workflows/ci.yml)
#   snowflake_ci - Snowflake, manual only (.github/workflows/ci-snowflake.yml)
# Auth reads paths/params from env vars, exactly like local dev, so each workflow
# just writes its secret to a file and points the env vars at it.
boc_economics:
  target: ci
  outputs:
    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('DBT_KEYFILE') }}"
      project: boc-dbt-portfolio-project
      dataset: boc_analytics_ci
      location: northamerica-northeast2
      threads: 4
      priority: interactive

    snowflake_ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', '') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', '') }}"
      schema: boc_analytics_ci
      threads: 4
