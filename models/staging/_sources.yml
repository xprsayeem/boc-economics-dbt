version: 2

sources:
  - name: boc_raw
    # Warehouse-agnostic: resolves to the project (BigQuery) or database
    # (Snowflake) of the active target, both of which contain the boc_raw schema.
    database: "{{ target.database }}"
    schema: boc_raw
    description: >
      Raw Bank of Canada Valet API series, landed by `ingestion/ingest_boc.py`
      (truncate-and-reload, one table per series). Columns are uniform across
      tables: obs_date (date), series_name (string, the Valet code), value (float).
    tables:
      - name: policy_rate
        description: "Target for the overnight rate — Valet series V39079 (daily)."
      - name: cpi
        description: "Total CPI, index level — Valet series V41690973 (monthly)."
      - name: fx_usdcad
        description: "USD/CAD daily average exchange rate — Valet series FXUSDCAD."
      - name: bond_5yr
        description: >
          Government of Canada 5-year benchmark bond yield —
          Valet series BD.CDN.5YR.DQ.YLD (daily).
