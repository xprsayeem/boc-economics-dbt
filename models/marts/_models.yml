version: 2

models:
  - name: fct_economic_indicators
    description: >
      Fact table feeding the dashboard: one row per (date_month, indicator_code)
      with the indicator value on a monthly grain. Join to dim_indicator for
      display names, units, and source.
    data_tests:
      - no_missing_months:
          arguments:
            date_column: date_month
            partition_by: indicator_code
    columns:
      - name: indicator_month_key
        description: "Surrogate key hashing (date_month, indicator_code). Enforces the fact grain."
        data_tests:
          - not_null
          - unique
      - name: date_month
        description: "Month of the observation (first day of the month)."
      - name: indicator_code
        description: "Indicator key. Foreign key to dim_indicator.indicator_code."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_indicator')
                field: indicator_code
          - accepted_values:
              arguments:
                values: ['policy_rate', 'cpi', 'fx_usdcad', 'bond_5yr']
      - name: value
        description: "Indicator value for the month."
        data_tests:
          - not_null
