name: dbt CI

# Rebuild and test the whole pipeline on every PR to main, against a separate
# CI dataset (boc_analytics_ci) so it never touches production data.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps

      - name: Write service account key
        run: echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: dbt debug
        env:
          DBT_KEYFILE: ${{ runner.temp }}/gcp-key.json
        run: dbt debug --profiles-dir ci --target ci

      - name: dbt build
        env:
          DBT_KEYFILE: ${{ runner.temp }}/gcp-key.json
        run: dbt build --profiles-dir ci --target ci
